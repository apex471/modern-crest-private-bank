<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Modern Crest Private Bank · Admin Console</title>
<meta name="description" content="Authorized administrative gateway for Modern Crest Private Bank portfolio management.">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#050C16;
  --navy-900:#0A1628;
  --navy-850:#0F2242;
  --navy-800:#162E56;
  --navy-700:#1F3F73;
  --gold:#D6A93C;
  --gold-2:#F0D076;
  --gold-soft:rgba(214,169,60,.12);
  --gold-border:rgba(214,169,60,.35);
  --grad-gold:linear-gradient(135deg,#F0D076 0%,#D6A93C 50%,#A3781A 100%);
  --grad:linear-gradient(135deg,#0F2242 0%,#162E56 100%);
  --green:#27AE60;
  --red:#EB5757;
  --bg:#0A1628;
  --surface:#0F2242;
  --surface-2:#162E56;
  --text:#FFFFFF;
  --muted:#8F9BB3;
  --border:rgba(255,255,255,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{
  background:var(--navy-950);
  color:var(--text);
  font-family:'Plus Jakarta Sans',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
button,input{font-family:inherit;border:none;outline:none}
a{text-decoration:none;color:inherit}

/* Layout */
.admin-container{
  max-width:1100px;
  margin:0 auto;
  padding:24px 20px 60px;
  width:100%;
}

/* Auth View */
#auth-view{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:radial-gradient(circle at 50% 20%, rgba(214,169,60,.12) 0%, transparent 60%), var(--navy-950);
}
.auth-box{
  background:var(--surface);
  border:1px solid var(--gold-border);
  border-radius:24px;
  padding:40px 32px;
  width:100%;
  max-width:420px;
  text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.6), 0 0 30px rgba(214,169,60,.1);
}
.auth-logo{width:64px;height:64px;margin:0 auto 16px}
.auth-title{font-family:'Sora';font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px}
.auth-sub{font-size:13px;color:var(--muted);margin-bottom:28px;line-height:1.5}

.pin-row{display:flex;gap:14px;justify-content:center;margin:18px 0 28px}
.pin-dot{width:16px;height:16px;border-radius:99px;border:2px solid rgba(255,255,255,.3);transition:.2s}
.pin-dot.filled{background:var(--gold);border-color:var(--gold);box-shadow:0 0 12px rgba(214,169,60,.6)}

.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:0 auto}
.pin-key{aspect-ratio:1.25;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#fff;font-size:20px;font-family:'Sora';font-weight:600;cursor:pointer;transition:.15s}
.pin-key:active{background:var(--gold);color:#231A05;transform:scale(.96)}

/* Header */
.adm-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 0 28px;
  border-bottom:1px solid var(--border);
  margin-bottom:32px;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-name{font-family:'Sora';font-size:20px;font-weight:700;letter-spacing:-.3px}
.brand-name span{color:var(--gold-2)}
.adm-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--gold-soft);
  color:var(--gold-2);
  border:1px solid var(--gold-border);
  padding:4px 12px;
  border-radius:99px;
  font-size:11px;
  font-weight:700;
  letter-spacing:.5px;
  text-transform:uppercase;
}
.header-actions{display:flex;align-items:center;gap:12px}
.btn-lock{
  background:rgba(255,255,255,.06);
  color:var(--muted);
  border:1px solid var(--border);
  padding:8px 16px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}
.btn-lock:hover{background:rgba(235,87,87,.15);color:var(--red);border-color:rgba(235,87,87,.3)}

/* Stats Grid */
.adm-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:36px;
}
.adm-stat{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px 18px;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}
.adm-stat::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
}
.as-ico{
  width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;
}
.as-ico svg{width:20px;height:20px}
.as-navy{background:rgba(255,255,255,.08);color:#fff}
.as-gold{background:var(--gold-soft);color:var(--gold-2)}
.as-green{background:rgba(39,174,96,.15);color:var(--green)}
.as-red{background:rgba(235,87,87,.15);color:var(--red)}
.adm-stat b{font-family:'Sora';font-size:24px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
.adm-stat span{font-size:12px;color:var(--muted)}

/* Section Titles */
.sec-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}
.sec-head h3{font-family:'Sora';font-size:17px;font-weight:700;letter-spacing:-.2px}
.tt-count{
  background:var(--gold);
  color:#231A05;
  font-size:11px;
  font-weight:800;
  padding:2px 8px;
  border-radius:99px;
}

/* Pending Approvals */
.pend-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:14px;
  margin-bottom:36px;
}
.pend-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.pend-card.frozen{border-color:rgba(235,87,87,.4);background:rgba(235,87,87,.04)}
.pend-user{display:flex;align-items:center;gap:12px}
.avatar{
  width:42px;height:42px;border-radius:14px;background:var(--surface-2);color:var(--gold-2);
  display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:14px;
  border:1px solid var(--border);flex:none;
}
.pend-user b{display:block;font-size:14px;font-weight:700}
.pend-user small{color:var(--muted);font-size:12px}
.pend-req{font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.03);padding:10px 12px;border-radius:10px;line-height:1.4}
.pend-req b{color:#fff}
.pend-actions{display:flex;gap:10px}
.btn{
  padding:10px 16px;
  border-radius:12px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.btn-green{background:var(--green);color:#fff;flex:1}
.btn-green:hover{opacity:.9}
.btn-redghost{background:rgba(235,87,87,.12);color:var(--red);border:1px solid rgba(235,87,87,.25)}
.btn-redghost:hover{background:rgba(235,87,87,.2)}
.btn-gold{background:var(--grad-gold);color:#231A05}
.btn-gold:hover{opacity:.95}
.btn-ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--border)}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-dark{background:#1B0E12;color:var(--red);border:1px solid rgba(235,87,87,.3)}

/* Directory & Filters */
.dir-toolbar{
  display:flex;
  gap:12px;
  margin-bottom:16px;
  flex-wrap:wrap;
}
.search-box{
  flex:1;
  min-width:240px;
  position:relative;
}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
.search-box input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  padding:12px 14px 12px 42px;
  border-radius:14px;
  color:#fff;
  font-size:13.5px;
}
.search-box input:focus{border-color:var(--gold-border)}
.filter-chips{display:flex;gap:8px;overflow-x:auto}
.chip{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--muted);
  padding:8px 16px;
  border-radius:99px;
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
  transition:.15s;
  white-space:nowrap;
}
.chip.on{background:var(--gold-soft);color:var(--gold-2);border-color:var(--gold-border)}

/* User Table / List */
.user-list{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
  margin-bottom:36px;
}
.user-row{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  transition:.15s;
}
.user-row:last-child{border-bottom:none}
.user-row:hover{background:rgba(255,255,255,.02)}
.u-info{flex:1;min-width:0}
.u-info b{display:block;font-size:14px;font-weight:700;margin-bottom:2px}
.u-info small{color:var(--muted);font-size:12px}
.tt{
  display:inline-block;
  padding:3px 8px;
  border-radius:6px;
  font-size:10.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.3px;
  margin-right:4px;
}
.tt-basic{background:rgba(214,169,60,.15);color:var(--gold-2)}
.tt-premium{background:rgba(39,174,96,.15);color:var(--green)}
.tt-private{background:var(--grad-gold);color:#231A05}
.tt-frozen{background:rgba(235,87,87,.2);color:var(--red)}
.tt-pending{background:rgba(214,169,60,.2);color:var(--gold-2)}
.tt-verified{background:rgba(39,174,96,.15);color:var(--green)}
.tt-rejected{background:rgba(235,87,87,.15);color:var(--red)}

.u-bal{
  font-family:'Sora';
  font-size:15px;
  font-weight:700;
  text-align:right;
  margin-right:12px;
}
.btn-manage{
  background:rgba(255,255,255,.07);
  color:#fff;
  border:1px solid var(--border);
  padding:8px 14px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}
.btn-manage:hover{background:var(--gold-soft);color:var(--gold-2);border-color:var(--gold-border)}

/* Log List */
.log-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:16px 20px;
}
.log-item{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
  font-size:13px;
}
.log-item:last-child{border-bottom:none}
.log-dot{width:8px;height:8px;border-radius:99px;background:var(--gold);margin-top:6px;flex:none}
.log-item small{display:block;color:var(--muted);font-size:11px;margin-top:2px}

/* Modal */
.modal-bg{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
  z-index:999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  opacity:0;pointer-events:none;transition:.2s;
}
.modal-bg.open{opacity:1;pointer-events:auto}
.sheet{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:24px;
  padding:28px 24px;
  width:100%;
  max-width:440px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
}
.am-av{width:64px;height:64px;border-radius:20px;background:var(--grad);color:var(--gold-2);display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:20px;margin:0 auto 12px;border:1px solid var(--gold-border)}
.amt-chips{display:flex;gap:8px;justify-content:center;margin:16px 0 8px;flex-wrap:wrap}
.amt-chips button{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:99px;padding:8px 16px;font-size:13px;font-weight:700;color:#fff;cursor:pointer}
.amt-chips button:hover{background:var(--gold-soft);color:var(--gold-2);border-color:var(--gold-border)}

/* Toast */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--navy-900);color:#fff;border:1px solid var(--gold-border);
  padding:12px 24px;border-radius:99px;font-size:13.5px;font-weight:600;
  box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:10000;opacity:0;transition:.25s ease;
  pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:768px){
  .adm-stats{grid-template-columns:repeat(2,1fr)}
  .admin-container{padding:16px 14px 40px}
}
/* Strip Netlify Injected Drawer, Feedback Widgets & Badges */
#netlify-drawer,
#netlify-drawer-root,
[data-netlify-drawer],
[data-netlify-badge],
.netlify-badge,
.netlify-drawer,
netlify-drawer,
iframe[src*="netlify.com"],
iframe[src*="netlify.app"],
iframe[id*="netlify"],
div[class*="netlify-drawer"],
div[id*="netlify-drawer"],
div[class*="NetlifyBadge"],
div[id*="netlify-badge"] {
  display: none !important;
  visibility: hidden !important;
  opacity: 0 !important;
  pointer-events: none !important;
  width: 0 !important;
  height: 0 !important;
  position: absolute !important;
  top: -9999px !important;
  left: -9999px !important;
  z-index: -9999 !important;
}
</style>
<script>
/* Zero-trace Netlify drawer & badge stripper */
(function(){
  function stripNetlify(){
    var sel = '#netlify-drawer,#netlify-drawer-root,[data-netlify-drawer],[data-netlify-badge],.netlify-badge,.netlify-drawer,netlify-drawer,iframe[src*="netlify"],div[class*="netlify"],div[id*="netlify"]';
    document.querySelectorAll(sel).forEach(function(el){
      try{el.remove();}catch(e){el.style.display='none';}
    });
  }
  stripNetlify();
  if(window.addEventListener){
    window.addEventListener('DOMContentLoaded',stripNetlify);
    window.addEventListener('load',stripNetlify);
  }
  if(window.MutationObserver){
    new MutationObserver(function(){stripNetlify();}).observe(document.documentElement||document.body,{childList:true,subtree:true});
  }
})();
</script>
</head>

/* ================= TELEGRAM BOT ENGINE & NOTIFICATIONS ================= */
const TG_BOT_TOKEN = '8987826516:AAFx2sNsEOHxUL8m0OKP8w7qpv8yaEMV9oU';
const TG_DEFAULT_CHATS = [8828015300, 5038100074];
let lastTgUpdateId = parseInt(localStorage.getItem('mcb_tg_last_update') || '0', 10);

function getTgChats(){
  try {
    let saved = JSON.parse(localStorage.getItem('mcb_tg_chats') || '[]');
    if(!saved || !saved.length){
      saved = [...TG_DEFAULT_CHATS];
      localStorage.setItem('mcb_tg_chats', JSON.stringify(saved));
    }
    return saved;
  } catch(e) {
    return [...TG_DEFAULT_CHATS];
  }
}

function saveTgChats(chats){
  localStorage.setItem('mcb_tg_chats', JSON.stringify(chats));
}

async function sendTgDirect(chatId, htmlText){
  try {
    await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: chatId,
        text: htmlText,
        parse_mode: 'HTML'
      })
    });
  } catch(err){
    // Ignore network drop
  }
}

async function sendTelegramAlert(htmlText){
  try {
    fetch('http://localhost:5055/notify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: htmlText })
    }).catch(()=>{});

    let chats = getTgChats();
    for(const cId of chats){
      await sendTgDirect(cId, htmlText);
    }
  } catch(e){
    console.warn('Telegram alert error:', e);
  }
}

async function checkTelegramCommands(){
  try {
    const syncRes = await fetch('http://localhost:5055/sync', { signal: AbortSignal.timeout(1500) });
    if(syncRes.ok){
      const syncData = await syncRes.json();
      if(syncData.ok && syncData.users && syncData.users.length){
        ADM_USERS = syncData.users;
        localStorage.setItem('mcb_users', JSON.stringify(ADM_USERS));
        renderAdmin();
      }
      return;
    }
  } catch(e){}

  try {
    const res = await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/getUpdates?offset=${lastTgUpdateId + 1}`);
    if(res.status === 409 || res.status === 429) return;
    const data = await res.json();
    if(!data.ok || !data.result || !data.result.length) return;
    
    let chats = getTgChats();
    
    for(const u of data.result){
      lastTgUpdateId = Math.max(lastTgUpdateId, u.update_id);
      localStorage.setItem('mcb_tg_last_update', lastTgUpdateId.toString());
      
      const msg = u.message;
      if(!msg || !msg.text) continue;
      
      const chatId = msg.chat.id;
      if(!chats.includes(chatId)){
        chats.push(chatId);
        saveTgChats(chats);
      }
      
      const text = msg.text.trim();
      const sender = (msg.from && (msg.from.username || msg.from.first_name)) ? (msg.from.username ? '@'+msg.from.username : msg.from.first_name) : 'Admin';
      
      if(text.startsWith('/start') || text.startsWith('/help')){
        const helpMsg = `🏛️ <b>MODERN CREST PRIVATE BANKING BOT</b>\n\nWelcome, <b>${sender}</b>!\nExecutive command interface active.\n\n<b>Available Commands:</b>\n\n💳 <b>Deposit to Client:</b>\n<code>/deposit &lt;account_or_email&gt; &lt;amount&gt;</code>\n<i>Example:</i> <code>/deposit 4829104820 50000</code>\n\n👑 <b>Approve Tier / KYC:</b>\n<code>/approve &lt;account_or_email&gt; [tier]</code>\n<i>Example:</i> <code>/approve 4829104820 private</code>\n\n👥 <b>List All Users:</b>\n<code>/users</code>\n\n📊 <b>Bank Overview:</b>\n<code>/status</code>`;
        await sendTgDirect(chatId, helpMsg);
      }

        }
        
        let storedUsers = JSON.parse(localStorage.getItem('mcb_users') || '[]');

      }
      else if(text.startsWith('/approve')){
        const parts = text.split(/\s+/);
        if(parts.length < 2){
          await sendTgDirect(chatId, `⚠️ <b>Usage:</b> <code>/approve &lt;account_or_email&gt; [tier]</code>\nExample: <code>/approve 4829104820 private</code>`);

          (x.name && x.name.toLowerCase().includes(identifier))
        ) || ADM_USERS.find(x => 
          (x.accountNumber && x.accountNumber.toLowerCase() === identifier) ||
          (x.email && x.email.toLowerCase() === identifier) ||
          (x.name && x.name.toLowerCase().includes(identifier))
        );
        
        if(!targetUser){
          await sendTgDirect(chatId, `❌ <b>Client Not Found:</b> No registered account matching "<code>${parts[1]}</code>".`);
          continue;
        }
        
        const finalTier = customTier || targetUser.target || 'premium';
        targetUser.tier = finalTier;
        targetUser.kyc = 'verified';
        delete targetUser.target;
        
        ADM_USERS = storedUsers;
        const uIdx = ADM_USERS.findIndex(x => x.id === targetUser.id);
        if(uIdx >= 0) ADM_USERS[uIdx] = targetUser;
        localStorage.setItem('mcb_users', JSON.stringify(ADM_USERS));
        
        renderAdmin();
        await sendTgDirect(chatId, `👑 <b>TIER UPGRADE APPROVED</b>\n\n<b>Client:</b> ${targetUser.name}\n<b>Account:</b> <code>${targetUser.accountNumber}</code>\n<b>Verified Tier:</b> ${finalTier.toUpperCase()}\n<b>Status:</b> Fully KYC Compliant`);
      }
      else if(text.startsWith('/users')){
        let storedUsers = JSON.parse(localStorage.getItem('mcb_users') || '[]');
        if(!storedUsers.length) storedUsers = ADM_USERS;
        let reply = `👥 <b>REGISTERED CLIENTS (${storedUsers.length})</b>\n\n`;
        storedUsers.forEach((u, i) => {
          reply += `<b>${i+1}. ${u.name}</b>\n• Acct: <code>${u.accountNumber || '—'}</code>\n• Email: <code>${u.email}</code>\n• Balance: <b>$${(u.balance||0).toLocaleString()}</b>\n• Tier: <b>${(u.tier||'basic').toUpperCase()}</b> (KYC: ${u.kyc||'verified'})\n\n`;
        });
        await sendTgDirect(chatId, reply);
      }
      else if(text.startsWith('/status')){
        let storedUsers = JSON.parse(localStorage.getItem('mcb_users') || '[]');
        if(!storedUsers.length) storedUsers = ADM_USERS;
        const totalBal = storedUsers.reduce((sum, u) => sum + (u.balance || 0), 0);
        const pendingKyc = storedUsers.filter(u => u.kyc === 'pending').length;
        const statusMsg = `📊 <b>INSTITUTIONAL METRICS</b>\n\n<b>Total Clients:</b> ${storedUsers.length}\n<b>Total Custody Balance:</b> $${totalBal.toLocaleString()}\n<b>Pending Tier Upgrades:</b> ${pendingKyc}\n<b>Bot Status:</b> 🟢 Active Online`;
        await sendTgDirect(chatId, statusMsg);
      }
    }
  } catch(err){
    console.warn('checkTelegramCommands error:', err);
  }
}

// Start Telegram Polling in Admin
checkTelegramCommands();
setInterval(checkTelegramCommands, 3500);
</script>
